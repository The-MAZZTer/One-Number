@if (data.title) {
  <h1 mat-dialog-title>{{data.title}}</h1>
}
@if (data.glyph) {
  <mat-icon>{{data.glyph}}</mat-icon>
}
@if (data.content) {
  <div mat-dialog-content>
    <p>{{data.content}}</p>
  </div>
}
<div mat-dialog-actions>
  @for (button of data.buttons; track button) {
    <button mat-raised-button [color]="button.color" [mat-dialog-close]="button.value" [attr.cdkFocusInitial]="button.value === data.defaultValue">{{button.text}}</button>
  }
</div>
